#!/bin/bash
# ==============================================================================
# GPTOSS20B.CONF | gpt-oss-20b Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for gpt-oss-20b.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# gpt-oss-20b (released August 2025 by OpenAI, Apache 2.0) is OpenAI's smaller
# open-weight reasoning/agentic model:
#
#   gpt-oss-20b  — 21B total / 3.6B active (32 experts, 4 active per token,
#                  24 transformer layers). Ships natively quantized in MXFP4
#                  for the MoE expert tensors — the *only* consumer-feasible
#                  tier of this family. Trained specifically for agentic tool
#                  use (web search / code execution / function calling) via
#                  OpenAI's "Harmony" response format.
#
#   gpt-oss-120b — 117B total / 5.1B active (36 layers). Smallest GGUF is
#                  still ~63 GB even at native MXFP4 — requires a 64GB+ card
#                  or multi-GPU server hardware. Not included in this conf.
#
# IMPORTANT — quant tiers barely change file size:
#   Unlike a normal dense/MoE model, requantizing gpt-oss-20b to Q2_K through
#   Q8_0 changes almost nothing: llama.cpp's quantizer keeps the MoE expert
#   tensors in their native MXFP4 (4.25-bit) format regardless of the
#   requested quant and only touches attention/embedding tensors, which are a
#   small fraction of total weights. Every tier below sits in an ~11-12.3 GiB
#   band (confirmed against the unsloth/gpt-oss-20b-GGUF HF repo blob sizes on
#   2026-09-14) — this is expected, not a mistake in this file. Practically,
#   gpt-oss-20b is a "12GB-class" model regardless of which quant is picked;
#   below that, llama.cpp partial-offloads to CPU via MODEL_N_LAYERS (24).
#
# IMPORTANT — tool-calling caveat:
#   gpt-oss's Harmony format is well-supported by llama.cpp's built-in chat
#   handler, and --jinja is the officially recommended way to run it (it also
#   allows passing --chat-template-kwargs '{"reasoning_effort":"..."}').
#   However, multiple open llama.cpp issues (ggml-org/llama.cpp #15205,
#   #17410; unsloth/gpt-oss-20b-GGUF #5) report the model sometimes emitting
#   reasoning_content that *describes* a tool call without producing an actual
#   OpenAI-style tool_calls structure, particularly with OpenCode/Cline-style
#   clients that don't forward prior reasoning content back on the next turn.
#   This is model/server behavior, not a template misconfiguration — no
#   MODEL_JINJA=false workaround fixes it (unlike llama4.conf /
#   qwen3.6-reap.conf, whose issues are template-format bugs). If tool calls
#   go missing mid-session, re-check open llama.cpp issues for a fix before
#   assuming this conf is misconfigured.
#
# Context length: 131,072 tokens natively (128k sliding-window attention).
#
# Thinking behaviour: gpt-oss reasons via the Harmony "analysis" channel by
# default. Its native control is reasoning_effort (low/medium/high, set via
# --chat-template-kwargs and only available with --jinja); MODEL_THINKING
# below uses ai-coder's generic --reasoning-budget 0 toggle instead, which
# truncates the reasoning channel at the server level.
#
# License: Apache 2.0 (no usage restrictions).
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_GPTOSS20B_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_GPTOSS20B_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-ngram}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-gpt-oss-20b}"

# KV cache quantization — q8_0 is fine; every tier leaves ample VRAM headroom.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Jinja chat template — ENABLED. gpt-oss's built-in Harmony template is what
# OpenAI/llama.cpp docs recommend running with; it also unlocks
# --chat-template-kwargs for reasoning_effort. See the tool-calling caveat
# above — this does not fully eliminate known upstream tool-call flakiness.
MODEL_JINJA="${MODEL_JINJA:-true}"

# Thinking mode — enabled by default (matches gpt-oss's built-in behavior).
# Turning it off gives snappier agent turns at some cost to planning quality
# on hard tasks.
# The "Thinking mode" question in ai --model overrides this default per
# user (on/off); MODEL_THINKING=false passes --reasoning-budget 0.
MODEL_THINKING="${MODEL_THINKING:-true}"

# No speculative-decoding draft wired: no small model shares gpt-oss's
# o200k_harmony tokenizer. Define MODEL_DRAFT_FILE/URL manually if one appears.

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback. Only 3 tiers are defined — see the size-clustering
# note above for why a normal 6-7 tier ladder would be misleading here.
#
# Sizes and sha256 sourced directly from the HF API for
# unsloth/gpt-oss-20b-GGUF on 2026-09-14 — re-verify if this file is touched
# again later, since the repo can be re-uploaded/renamed without notice.
#   UD-Q8_K_XL = 12.29 GiB  (unsloth dynamic quant, best quality)
#   Q6_K       = 11.21 GiB  (static 6-bit)
#   UD-Q4_K_XL = 11.06 GiB  (unsloth dynamic quant, fallback)
MODEL_COUNT="${MODEL_COUNT:-3}"

# 1 — UD-Q8_K_XL: 12.29 GiB; best quality dynamic quant; fits 16GB+
MODEL_1_FILE="${MODEL_1_FILE:-gptoss20b/gpt-oss-20b-UD-Q8_K_XL.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/unsloth/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-UD-Q8_K_XL.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-b97fa9f3efa642ef3abd599a170f0b26612e5179a4ef5c65fb8852fb974ec239}"
MODEL_1_DESC="${MODEL_1_DESC:-gpt-oss-20b UD-Q8_K_XL (~12.3GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-13}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-24}"
MODEL_1_KV="${MODEL_1_KV:-6144/6144}"
MODEL_1_KV_SWA="${MODEL_1_KV_SWA:-6144/6144@128}"

# 2 — Q6_K: 11.21 GiB; static 6-bit; fits 14GB+
MODEL_2_FILE="${MODEL_2_FILE:-gptoss20b/gpt-oss-20b-Q6_K.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/unsloth/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-Q6_K.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-f2ead52a7842a556ea10d5edd91a88e5af974856d2485ecaad3aade679832935}"
MODEL_2_DESC="${MODEL_2_DESC:-gpt-oss-20b Q6_K (~11.2GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-12}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-24}"
MODEL_2_KV="${MODEL_2_KV:-6144/6144}"
MODEL_2_KV_SWA="${MODEL_2_KV_SWA:-6144/6144@128}"

# 3 — UD-Q4_K_XL: 11.06 GiB; unconditional fallback (WEIGHTS_GB=0); fits 12GB+
# (below 12GB, llama.cpp partial-offloads layers to CPU)
MODEL_3_FILE="${MODEL_3_FILE:-gptoss20b/gpt-oss-20b-UD-Q4_K_XL.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/unsloth/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-UD-Q4_K_XL.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-10fe673de12c20b74b8d670a9fdf0fd36b43b0a86ffc04daeb175c0a2b98c4f9}"
MODEL_3_DESC="${MODEL_3_DESC:-gpt-oss-20b UD-Q4_K_XL (~11.1GB, fallback)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-0}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-24}"
MODEL_3_KV="${MODEL_3_KV:-6144/6144}"
MODEL_3_KV_SWA="${MODEL_3_KV_SWA:-6144/6144@128}"

# --- [ SGLANG MODELS ] --------------------------------------------------------
# Used instead of the GGUF list above when the engine setting is SGLang
# (--setup). OpenAI's official MXFP4 release, pinned to a commit. The repo's
# original/ and metal/ copies are skipped by the downloader, leaving ~13.8GB.
# See config/ai-coder-model.conf for the MODEL_SGL_* field reference.
MODEL_SGL_COUNT="${MODEL_SGL_COUNT:-1}"
MODEL_SGL_TOOL_PARSER="${MODEL_SGL_TOOL_PARSER:-gpt-oss}"
MODEL_SGL_REASONING_PARSER="${MODEL_SGL_REASONING_PARSER:-gpt-oss}"

# 1 — gpt-oss-20b MXFP4: 13.8 GB; the only tier, so the fallback (WEIGHTS_GB=0)
MODEL_SGL_1_REPO="${MODEL_SGL_1_REPO:-openai/gpt-oss-20b}"
MODEL_SGL_1_REVISION="${MODEL_SGL_1_REVISION:-6cee5e81ee83917806bbde320786a8fb61efebee}"
MODEL_SGL_1_DESC="${MODEL_SGL_1_DESC:-gpt-oss-20b MXFP4 (~13.8GB)}"
MODEL_SGL_1_WEIGHTS_GB="${MODEL_SGL_1_WEIGHTS_GB:-0}"
MODEL_SGL_1_KV="${MODEL_SGL_1_KV:-6144/6144}"
MODEL_SGL_1_KV_SWA="${MODEL_SGL_1_KV_SWA:-6144/6144@128}"
MODEL_SGL_1_MAX_CTX="${MODEL_SGL_1_MAX_CTX:-131072}"
