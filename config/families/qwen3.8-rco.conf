#!/bin/bash
# ==============================================================================
# QWEN3.8RCO.CONF | Qwen3.8 GSQ-RCO Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for Qwen3.8
# non-uniform GGUFs produced by ISTA-DASLab (Institute of Science and
# Technology Austria - Deep Algorithms and Systems Lab).
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# Repo: ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF
#
# Method:
#   Couples Generalized Scalar Quantization (GSQ) with Riemannian Constrained
#   Optimization (RCO) to assign variable bit-depths per tensor under a global
#   size budget. Delivers "task-lossless" reasoning down to 3.5 bpw (11.8 GB).
#
# Architecture:
#   Hybrid Gated-DeltaNet (64 layers total: 16 full self-attention, 48 SSM /
#   linear-attention). KV cache grows only across the 16 full-attention layers.
#   Native context: 262,144 tokens.
#
# Speculative Decoding / MTP:
#   ISTA-DASLab embeds the Multi-Token Prediction module directly into optional
#   companion builds (*-mtp.gguf, ~0.35GB larger) rather than using an external
#   standalone draft file.
#   - When MODEL_SPEC_STRATEGY=mtp, the embedded MTP builds are used.
#   - When MODEL_SPEC_STRATEGY=none or ngram, standard non-MTP files are used.
#
# Every setting can be overridden by exporting the variable before invoking ai-coder.

# Guard against double-sourcing
[ "${_AI_CODER_QWEN38RCO_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_QWEN38RCO_CONF_LOADED=1

# Speculative Decoding Strategy
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-mtp}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

MODEL_FAMILY="${MODEL_FAMILY:-Qwen3.8-GSQ-RCO}"
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"
MODEL_JINJA="${MODEL_JINJA:-true}"

# Sampling defaults per Qwen3.8 model guidelines
MODEL_SAMPLING="${MODEL_SAMPLING:-temp=1.0 top_p=0.95 top_k=20 min_p=0 presence_penalty=0}"
MODEL_SAMPLING_NOTHINK="${MODEL_SAMPLING_NOTHINK:-temp=0.7 top_p=0.8 top_k=20 min_p=0 presence_penalty=1.5}"

MODEL_REASONING_PRESERVE="${MODEL_REASONING_PRESERVE:-true}"
MODEL_MAX_OUTPUT="${MODEL_MAX_OUTPUT:-131072}"
MODEL_THINKING="${MODEL_THINKING:-true}"
MODEL_REPEAT_PENALTY="${MODEL_REPEAT_PENALTY:-}"

# Suffix switch for embedded MTP builds
if [ "$MODEL_SPEC_STRATEGY" = "mtp" ]; then
    _MTP_SUF="-mtp"
    _MTP_DESC=" [MTP]"
else
    _MTP_SUF=""
    _MTP_DESC=""
fi

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Four non-uniform GGUF quantization tiers available from ISTA-DASLab:
#   IQ3_S   = 11.8 GB  (3.50 bpw) - Task-lossless sweet spot for 16GB cards
#   IQ3_XXS = 10.1 GB  (3.00 bpw) - Balanced all-round operating point
#   IQ2_S   =  9.3 GB  (2.75 bpw) - Matches base model on AIME25
#   IQ2_XS  =  8.4 GB  (2.50 bpw) - Unconditional fallback
MODEL_COUNT="${MODEL_COUNT:-4}"

# 1 — IQ3_S (3.50 bpw): Task-lossless sweet spot; fits 16GB VRAM with ample KV
MODEL_1_FILE="${MODEL_1_FILE:-qwen3.8-rco/Qwen3.8-27B-GSQ-RCO-IQ3_S${_MTP_SUF}.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Qwen3.8-27B-GSQ-RCO-IQ3_S${_MTP_SUF}.gguf}"
if [ "$MODEL_SPEC_STRATEGY" != "mtp" ]; then
    MODEL_1_SHA256="${MODEL_1_SHA256:-64b53b64c7aa39f2858b9758784bf1e2ba5d2334f5979774d0e74f1791a82f34}"
else
    MODEL_1_SHA256="${MODEL_1_SHA256:-}"
fi
MODEL_1_DESC="${MODEL_1_DESC:-Qwen3.8 27B GSQ-RCO IQ3_S (~11.8GB, task-lossless)${_MTP_DESC}}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-12}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-64}"
MODEL_1_KV="${MODEL_1_KV:-17408/17408}"

# 2 — IQ3_XXS (3.00 bpw): High efficiency; fits 12GB–16GB VRAM
MODEL_2_FILE="${MODEL_2_FILE:-qwen3.8-rco/Qwen3.8-27B-GSQ-RCO-IQ3_XXS${_MTP_SUF}.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Qwen3.8-27B-GSQ-RCO-IQ3_XXS${_MTP_SUF}.gguf}"
if [ "$MODEL_SPEC_STRATEGY" != "mtp" ]; then
    MODEL_2_SHA256="${MODEL_2_SHA256:-fdfcb6a29b11188956dfbfd904223588a6c1b77eb250c3e8a36e1bd269df91f7}"
else
    MODEL_2_SHA256="${MODEL_2_SHA256:-}"
fi
MODEL_2_DESC="${MODEL_2_DESC:-Qwen3.8 27B GSQ-RCO IQ3_XXS (~10.1GB)${_MTP_DESC}}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-11}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-64}"
MODEL_2_KV="${MODEL_2_KV:-17408/17408}"

# 3 — IQ2_S (2.75 bpw): Matches AIME25 base accuracy; fits 12GB cards
MODEL_3_FILE="${MODEL_3_FILE:-qwen3.8-rco/Qwen3.8-27B-GSQ-RCO-IQ2_S${_MTP_SUF}.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Qwen3.8-27B-GSQ-RCO-IQ2_S${_MTP_SUF}.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-}"
MODEL_3_DESC="${MODEL_3_DESC:-Qwen3.8 27B GSQ-RCO IQ2_S (~9.3GB)${_MTP_DESC}}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-10}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-64}"
MODEL_3_KV="${MODEL_3_KV:-17408/17408}"

# 4 — IQ2_XS (2.50 bpw): Unconditional fallback (WEIGHTS_GB=0); fits 10GB–12GB VRAM
MODEL_4_FILE="${MODEL_4_FILE:-qwen3.8-rco/Qwen3.8-27B-GSQ-RCO-IQ2_XS${_MTP_SUF}.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/ISTA-DASLab/Qwen3.8-27B-GSQ-RCO-GGUF/resolve/main/Qwen3.8-27B-GSQ-RCO-IQ2_XS${_MTP_SUF}.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-}"
MODEL_4_DESC="${MODEL_4_DESC:-Qwen3.8 27B GSQ-RCO IQ2_XS (~8.4GB, fallback)${_MTP_DESC}}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-0}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-64}"
MODEL_4_KV="${MODEL_4_KV:-17408/17408}"

# --- [ SGLANG MODELS ] --------------------------------------------------------
# GSQ-RCO is packaged for llama.cpp / GGUF; SGLang falls back to standard FP8 / INT4
MODEL_SGL_COUNT="${MODEL_SGL_COUNT:-2}"
MODEL_SGL_TOOL_PARSER="${MODEL_SGL_TOOL_PARSER:-qwen3_coder}"
MODEL_SGL_REASONING_PARSER="${MODEL_SGL_REASONING_PARSER:-qwen3}"

# 1 — Qwen3.8 27B FP8: 30.9 GB
MODEL_SGL_1_REPO="${MODEL_SGL_1_REPO:-Qwen/Qwen3.8-27B-FP8}"
MODEL_SGL_1_REVISION="${MODEL_SGL_1_REVISION:-017b9c7af6b5689d5dd426a76e0bc077eb5ca20a}"
MODEL_SGL_1_DESC="${MODEL_SGL_1_DESC:-Qwen3.8 27B FP8 (~30.9GB)}"
MODEL_SGL_1_WEIGHTS_GB="${MODEL_SGL_1_WEIGHTS_GB:-31}"
MODEL_SGL_1_KV="${MODEL_SGL_1_KV:-16384/16384}"
MODEL_SGL_1_MAX_CTX="${MODEL_SGL_1_MAX_CTX:-262144}"

# 2 — Qwen3.8 27B INT4 W4A16: 19.5 GB; fallback (WEIGHTS_GB=0)
MODEL_SGL_2_REPO="${MODEL_SGL_2_REPO:-RedHatAI/Qwen3.8-27B-INT4}"
MODEL_SGL_2_REVISION="${MODEL_SGL_2_REVISION:-2f0fa48fea4949b56685ddfc48c05dd81c7d772b}"
MODEL_SGL_2_DESC="${MODEL_SGL_2_DESC:-Qwen3.8 27B INT4 W4A16 (~19.5GB, fallback)}"
MODEL_SGL_2_WEIGHTS_GB="${MODEL_SGL_2_WEIGHTS_GB:-0}"
MODEL_SGL_2_KV="${MODEL_SGL_2_KV:-16384/16384}"
MODEL_SGL_2_MAX_CTX="${MODEL_SGL_2_MAX_CTX:-262144}"
MODEL_SGL_2_SIZE_GB="${MODEL_SGL_2_SIZE_GB:-20}"
