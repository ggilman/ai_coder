#!/bin/bash
# ==============================================================================
# QWEN3.6-REAP.CONF | Qwen3.6 REAP (Expert-Pruned) Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for the
# REAP-pruned Qwen3.6 MoE. Sourced by ai-coder after family selection,
# following config/ai-coder-model.conf.
#
# REAP (Router-weighted Expert Activation Pruning, Cerebras / arXiv:2510.13999)
# is a one-shot MoE compression method: it removes the least-salient experts
# from each MoE layer (using a combination of router gate values and expert
# activation norms) and renormalizes the router over the survivors, without
# any fine-tuning step.
#
#   Base model — Qwen3.6-35B-A3B (35B total / 3B active, 256 experts/layer,
#                the same model backing config/families/qwen3.6.conf).
#   This family — Qwen3.6-28B-A3B, produced by applying REAP at a 20% pruning
#                ratio (205/256 experts/layer kept). Same 3B active params and
#                the same 40 transformer layers as the base model — pruning
#                removes experts, not layers, so inference speed is unchanged.
#                Published REAP benchmarks show this ratio is near-lossless on
#                coding evals (HumanEval/MBPP/LiveCodeBench-style).
#
# Why add this alongside config/families/qwen3.6.conf instead of merging tiers:
#   A REAP-pruned model needs fewer bits-per-weight to reach the same file
#   size as the full 256-expert model, since it has fewer weights to begin
#   with. That means a given VRAM budget can either run a smaller file, or
#   afford a higher-precision quant than the full model would allow at the
#   same footprint. But pruning is a one-shot, non-recoverable compression —
#   quality retention is validated on published coding benchmarks, not on
#   every possible workload. Keeping this as a separate, explicitly-selected
#   family (mirroring the existing Qwen3.6 vs. Qwen3.6 MTP split) makes the
#   max-quality-vs-more-VRAM-headroom tradeoff a deliberate user choice
#   instead of an automatic ranking.
#
# Provenance — this is a COMMUNITY quant, not an official Qwen/unsloth release:
#   0xSero/Qwen3.6-28B applied the REAP-20% pruning to Qwen3.6-35B-A3B, and
#   mradermacher produced the imatrix ("i1") GGUF quantizations used below.
#   Sizes and sha256 were pulled directly from the HF API
#   (huggingface.co/api/models/mradermacher/Qwen3.6-28B-REAP-i1-GGUF?blobs=true)
#   on 2026-09-14 — re-verify if this file is touched again later, since
#   community repos can be re-uploaded/renamed without notice.
#
# IMPORTANT — chat template diverges from the base Qwen3.6 family:
#   Unlike the official Qwen3.6 template (standard JSON tool calls, safe with
#   --jinja per qwen3.6.conf), this REAP repo's embedded Jinja template emits
#   tool calls in <tool_call><function=...><parameter=...> XML form — the same
#   format config/families/llama4.conf found llama.cpp does not reliably
#   convert to proper OpenAI-style tool_calls. MODEL_JINJA is therefore
#   disabled below so llama.cpp's internal format handler is used instead.
#
# Context length: 262,144 tokens natively (confirmed via HF GGUF metadata,
# same as the base Qwen3.6-35B-A3B model).
#
# Thinking behaviour: same as base Qwen3.6 — no /think /nothink soft switches;
# the model thinks by default, controlled server-side via enable_thinking.
#
# Architecture: GGUF-reports "qwen35moe" — the same arch tag llama.cpp already
# loads for config/families/qwen3.6.conf, just with fewer expert tensors per
# layer, so no new llama.cpp support is required.
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_QWEN36_REAP_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_QWEN36_REAP_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-ngram}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-Qwen3.6 REAP}"

# KV cache quantization — q8_0 is fine; all tiers fit within their VRAM budget.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Jinja chat template — DISABLED. This repo's embedded template produces
# <function=...> XML-style tool calls that llama.cpp does not reliably parse
# into OpenAI-style tool_calls (same issue as config/families/llama4.conf).
# llama.cpp's internal format handler is used instead.
MODEL_JINJA="${MODEL_JINJA:-false}"

# Thinking mode — disabled by default for agent use: reasoning tokens before
# every tool call make agent loops sluggish. (Same rationale as qwen3.6.conf;
# no /think soft switches exist, so this server-side toggle is the only control.)
# Set MODEL_THINKING=true to re-enable for harder planning-heavy tasks.
MODEL_THINKING="${MODEL_THINKING:-true}"

# No speculative-decoding draft wired: no compatible small draft model exists
# for this pruned variant.

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback.
#
# Sizes and sha256 sourced directly from the HF API for
# mradermacher/Qwen3.6-28B-REAP-i1-GGUF (imatrix quants) on 2026-09-14:
#   28B-A3B i1-Q6_K    = 23.23 GB  (REAP20 MoE, near-lossless 6-bit)
#   28B-A3B i1-Q5_K_M  = 20.16 GB  (REAP20 MoE)
#   28B-A3B i1-Q4_K_M  = 17.26 GB  (REAP20 MoE, recommended balance)
#   28B-A3B i1-Q3_K_M  = 13.69 GB  (REAP20 MoE)
#   28B-A3B i1-IQ3_XS  = 11.86 GB  (REAP20 MoE)
#   28B-A3B i1-Q2_K    = 10.60 GB  (REAP20 MoE, fallback)
MODEL_COUNT="${MODEL_COUNT:-6}"

# 1 — 28B-A3B i1-Q6_K: 23.23 GB; near-lossless 6-bit REAP20 MoE; fits 28GB+
MODEL_1_FILE="${MODEL_1_FILE:-qwen3.6-reap/Qwen3.6-28B-REAP.i1-Q6_K.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/mradermacher/Qwen3.6-28B-REAP-i1-GGUF/resolve/main/Qwen3.6-28B-REAP.i1-Q6_K.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-65bf58e5a14c65862fa3cf356e70b208c6b461b40c729d5a567737c355f7a71e}"
MODEL_1_DESC="${MODEL_1_DESC:-Qwen3.6 REAP20 28B-A3B i1-Q6_K MoE (~23.2GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-24}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-40}"

# 2 — 28B-A3B i1-Q5_K_M: 20.16 GB; 5-bit REAP20 MoE; fits 24GB+
MODEL_2_FILE="${MODEL_2_FILE:-qwen3.6-reap/Qwen3.6-28B-REAP.i1-Q5_K_M.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/mradermacher/Qwen3.6-28B-REAP-i1-GGUF/resolve/main/Qwen3.6-28B-REAP.i1-Q5_K_M.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-e40948800908b18f459b377b7786579baf99e74725c6647415c0353ba113c3b2}"
MODEL_2_DESC="${MODEL_2_DESC:-Qwen3.6 REAP20 28B-A3B i1-Q5_K_M MoE (~20.2GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-21}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-40}"

# 3 — 28B-A3B i1-Q4_K_M: 17.26 GB; standard 4-bit REAP20 MoE sweet spot; fits 21GB+
MODEL_3_FILE="${MODEL_3_FILE:-qwen3.6-reap/Qwen3.6-28B-REAP.i1-Q4_K_M.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/mradermacher/Qwen3.6-28B-REAP-i1-GGUF/resolve/main/Qwen3.6-28B-REAP.i1-Q4_K_M.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-d00a901aec7ecbdd022db1b7aafdbabcd0e2f0196232347a7c4d08cfae8fca53}"
MODEL_3_DESC="${MODEL_3_DESC:-Qwen3.6 REAP20 28B-A3B i1-Q4_K_M MoE (~17.3GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-18}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-40}"

# 4 — 28B-A3B i1-Q3_K_M: 13.69 GB; 3-bit REAP20 MoE; fits 17GB+
MODEL_4_FILE="${MODEL_4_FILE:-qwen3.6-reap/Qwen3.6-28B-REAP.i1-Q3_K_M.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/mradermacher/Qwen3.6-28B-REAP-i1-GGUF/resolve/main/Qwen3.6-28B-REAP.i1-Q3_K_M.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-625a766284a8828d1e7e937905a20ba2127f9cc6f96aed82b2ba73f50dd57ff7}"
MODEL_4_DESC="${MODEL_4_DESC:-Qwen3.6 REAP20 28B-A3B i1-Q3_K_M MoE (~13.7GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-14}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-40}"

# 5 — 28B-A3B i1-IQ3_XS: 11.86 GB; imatrix 3-bit REAP20 MoE; fits 15GB+
MODEL_5_FILE="${MODEL_5_FILE:-qwen3.6-reap/Qwen3.6-28B-REAP.i1-IQ3_XS.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/mradermacher/Qwen3.6-28B-REAP-i1-GGUF/resolve/main/Qwen3.6-28B-REAP.i1-IQ3_XS.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-9223e268efcfe531990ab2e8a9de116959296db5b2ade1f59577bc8e2b0745d2}"
MODEL_5_DESC="${MODEL_5_DESC:-Qwen3.6 REAP20 28B-A3B i1-IQ3_XS MoE (~11.9GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-12}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-40}"

# 6 — 28B-A3B i1-Q2_K: 10.60 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_6_FILE="${MODEL_6_FILE:-qwen3.6-reap/Qwen3.6-28B-REAP.i1-Q2_K.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/mradermacher/Qwen3.6-28B-REAP-i1-GGUF/resolve/main/Qwen3.6-28B-REAP.i1-Q2_K.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-648d95dfc89d0a056e6265d831f0b85846d56d480437fd9f19697d15f05a127a}"
MODEL_6_DESC="${MODEL_6_DESC:-Qwen3.6 REAP20 28B-A3B i1-Q2_K MoE (~10.6GB, fallback)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-0}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-40}"
