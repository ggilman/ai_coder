#!/bin/bash
# ==============================================================================
# GLM4.7FLASH.CONF | GLM-4.7-Flash Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for
# GLM-4.7-Flash. Sourced by ai-coder after family selection, following
# config/ai-coder-model.conf.
#
# GLM-4.7-Flash (Zhipu / Z.ai, glm4_moe_lite architecture) is the small,
# consumer-GPU-feasible member of the GLM-4.x agentic-coding family — the
# same lineage behind GLM-4.6/4.7 and GLM-5.x, which run 300B-700B+ total
# params and are out of scope for this project (see qwen3.8.conf /
# llama4.conf for the same "flagship too big" pattern):
#
#   GLM-4.7-Flash — 31B total / ~3B active MoE (64 routed experts + 1 shared,
#                   4 active per token, 47 transformer layers). Positioned by
#                   Zhipu specifically as a local coding-agent model; strong
#                   OpenCode/Claude-Code-CLI community adoption.
#
# IMPORTANT — tool-calling caveat:
#   Multiple open llama.cpp issues (ggml-org/llama.cpp #19009, #19068) report
#   that GLM-4.7-Flash's own Jinja template "supports tool calls but does not
#   natively describe tools" to the model, and that --jinja mode can enter a
#   corrupted/gibberish state under some client prompt shapes. This mirrors
#   the exact issue config/families/llama4.conf and
#   config/families/qwen3.6-reap.conf already work around — MODEL_JINJA is
#   therefore disabled below so llama.cpp's internal (non-jinja) format
#   handler produces the tool_calls structure instead. If upstream fixes the
#   template, re-test with MODEL_JINJA=true before assuming it's still needed.
#
# Context length: 202,752 tokens natively per HF config.json (confirmed
# 2026-09-14).
#
# Thinking behaviour: GLM-4.7-Flash reasons by default, controlled server-side
# via MODEL_THINKING below (no /think /nothink soft switches, same as
# Qwen3.6/Qwen3.6-REAP).
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_GLM47FLASH_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_GLM47FLASH_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-ngram}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-GLM-4.7-Flash}"

# KV cache quantization — q8_0 is fine; all tiers fit within their VRAM budget.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Jinja chat template — DISABLED. GLM-4.7-Flash's template doesn't natively
# describe tools to the model and has reported instability under --jinja
# (see the tool-calling caveat above). llama.cpp's internal format handler is
# used instead, matching llama4.conf / qwen3.6-reap.conf.
MODEL_JINJA="${MODEL_JINJA:-false}"

# Thinking mode — disabled by default for agent use: reasoning tokens before
# every tool call make agent loops sluggish.
# The "Thinking mode" question in ai --model overrides this default per
# user (on/off); MODEL_THINKING=false passes --reasoning-budget 0.
MODEL_THINKING="${MODEL_THINKING:-false}"

# No speculative-decoding draft wired: no small model shares GLM-4.7-Flash's
# tokenizer. Define MODEL_DRAFT_FILE/URL manually if one appears.

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first, using unsloth's dynamic "UD" quants
# throughout for consistency (matches qwen3.6.conf's sourcing convention).
# The last entry (MODEL_N_WEIGHTS_GB=0) is the unconditional fallback.
#
# Sizes and sha256 sourced directly from the HF API for
# unsloth/GLM-4.7-Flash-GGUF on 2026-09-14 — re-verify if this file is touched
# again later, since community/vendor repos can be re-uploaded without notice.
#   UD-Q8_K_XL = 33.18 GiB
#   UD-Q6_K_XL = 24.38 GiB
#   UD-Q5_K_XL = 20.20 GiB
#   UD-Q4_K_XL = 16.32 GiB  (sweet spot for 24GB cards)
#   UD-Q3_K_XL = 12.84 GiB
#   UD-Q2_K_XL = 11.07 GiB
#   UD-IQ2_XXS =  9.79 GiB  (fallback)
MODEL_COUNT="${MODEL_COUNT:-7}"

# 1 — UD-Q8_K_XL: 33.18 GiB; near-lossless 8-bit dynamic quant; fits 40GB+
MODEL_1_FILE="${MODEL_1_FILE:-glm4.7flash/GLM-4.7-Flash-UD-Q8_K_XL.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-Q8_K_XL.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-f07a3b8fce22b5774610ba60f7db9176ea9538ea9f6be357c4a1fced0c7c0882}"
MODEL_1_DESC="${MODEL_1_DESC:-GLM-4.7-Flash UD-Q8_K_XL (~33.2GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-34}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-47}"
MODEL_1_KV="${MODEL_1_KV:-27072/0}"

# 2 — UD-Q6_K_XL: 24.38 GiB; 6-bit dynamic quant; fits 31GB+
MODEL_2_FILE="${MODEL_2_FILE:-glm4.7flash/GLM-4.7-Flash-UD-Q6_K_XL.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-Q6_K_XL.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-b5ddf6a5531a4d06ce84a652419c8d32c0cb15ca64549d715f783de948a3f3e2}"
MODEL_2_DESC="${MODEL_2_DESC:-GLM-4.7-Flash UD-Q6_K_XL (~24.4GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-25}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-47}"
MODEL_2_KV="${MODEL_2_KV:-27072/0}"

# 3 — UD-Q5_K_XL: 20.20 GiB; 5-bit dynamic quant; fits 27GB+
MODEL_3_FILE="${MODEL_3_FILE:-glm4.7flash/GLM-4.7-Flash-UD-Q5_K_XL.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-Q5_K_XL.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-1e02f8b6cb4ae5d14e05aa3bf57361db0a69c79cc2f44e12f5a0e4d10fb93cd5}"
MODEL_3_DESC="${MODEL_3_DESC:-GLM-4.7-Flash UD-Q5_K_XL (~20.2GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-21}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-47}"
MODEL_3_KV="${MODEL_3_KV:-27072/0}"

# 4 — UD-Q4_K_XL: 16.32 GiB; 4-bit dynamic quant sweet spot; fits 22GB+ (big win for 24GB cards)
MODEL_4_FILE="${MODEL_4_FILE:-glm4.7flash/GLM-4.7-Flash-UD-Q4_K_XL.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-Q4_K_XL.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-b0d4fbc1211f891b4cfbf2a497160bfe06a49412420068904d426b7a13f4ba7f}"
MODEL_4_DESC="${MODEL_4_DESC:-GLM-4.7-Flash UD-Q4_K_XL (~16.3GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-17}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-47}"
MODEL_4_KV="${MODEL_4_KV:-27072/0}"

# 5 — UD-Q3_K_XL: 12.84 GiB; 3-bit dynamic quant; fits 18GB+
MODEL_5_FILE="${MODEL_5_FILE:-glm4.7flash/GLM-4.7-Flash-UD-Q3_K_XL.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-Q3_K_XL.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-582728c0f6931a1cf734d5a7cf60ec73522fb79811e004cbc12476dd69b033bf}"
MODEL_5_DESC="${MODEL_5_DESC:-GLM-4.7-Flash UD-Q3_K_XL (~12.8GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-13}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-47}"
MODEL_5_KV="${MODEL_5_KV:-27072/0}"

# 6 — UD-Q2_K_XL: 11.07 GiB; 2-bit dynamic quant; fits 16GB+
MODEL_6_FILE="${MODEL_6_FILE:-glm4.7flash/GLM-4.7-Flash-UD-Q2_K_XL.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-Q2_K_XL.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-08a432581d3a797af07a021455ada33499185213ad250e85fb26daf3fe34c421}"
MODEL_6_DESC="${MODEL_6_DESC:-GLM-4.7-Flash UD-Q2_K_XL (~11.1GB)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-12}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-47}"
MODEL_6_KV="${MODEL_6_KV:-27072/0}"

# 7 — UD-IQ2_XXS: 9.79 GiB; unconditional fallback (WEIGHTS_GB=0); fits 8-12GB tier
MODEL_7_FILE="${MODEL_7_FILE:-glm4.7flash/GLM-4.7-Flash-UD-IQ2_XXS.gguf}"
MODEL_7_URL="${MODEL_7_URL:-https://huggingface.co/unsloth/GLM-4.7-Flash-GGUF/resolve/main/GLM-4.7-Flash-UD-IQ2_XXS.gguf}"
MODEL_7_SHA256="${MODEL_7_SHA256:-d927162886f337ef4e1ddbeb6de1aac2872981629291d3b2444da9e6a1205166}"
MODEL_7_DESC="${MODEL_7_DESC:-GLM-4.7-Flash UD-IQ2_XXS (~9.79GB, fallback)}"
MODEL_7_WEIGHTS_GB="${MODEL_7_WEIGHTS_GB:-0}"
MODEL_7_LAYERS="${MODEL_7_LAYERS:-47}"
MODEL_7_KV="${MODEL_7_KV:-27072/0}"
