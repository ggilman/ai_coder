#!/bin/bash
# ==============================================================================
# QWEN3.8.CONF | Qwen3.8 Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for Qwen3.8.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# Qwen3.8 (released August 2026) is built on the Qwen3.5 architectural
# foundation and ships two variants:
#
#   Qwen3.8-27B        — dense, deployment-friendly, native vision-language
#                         model with flexible thinking control. The only
#                         variant that's consumer-GPU feasible; used for
#                         every tier below.
#   Qwen3.8-2.4T-A95B  — MoE "Qwen-Max-class" open release (2.4T total /
#                         95B active). Not wired here: even the lowest-bit
#                         GGUF quants run 400GB-2.6TB+, far beyond any
#                         single-GPU workbench this project targets.
#
# Context length: 262,144 tokens natively; extensible to 1,000,000 via YaRN.
#
# Thinking behaviour:
#   Thinking mode is enabled by default and tunable per request (no /think
#   or /no_think chat-template soft switches, per unsloth's docs) — same
#   server-side toggle pattern as Qwen3.6: pass enable_thinking: false in
#   the API request body to disable.
#
# Includes a vision encoder (image + video input supported). NOTE: this
# project does not currently wire up --mmproj for any family, so vision
# input isn't reachable through ai-coder yet even though unsloth publishes
# mmproj-BF16.gguf/mmproj-F16.gguf alongside the text weights.
#
# GGUF quants use Unsloth Dynamic V3.0; sizes below are confirmed against the
# unsloth/Qwen3.8-27B-GGUF repo file listing (verified September 2026 via the
# HF API's blobs=true sha256 metadata, not just the model card prose).
#
# Speculative decoding: unlike Qwen3.6 (where MTP shipped as a full duplicate
# set of weights in a separate *-MTP-GGUF repo, selected as its own family —
# see qwen3.6MTP.conf), Qwen3.8's MTP support is a small companion draft-head
# file (MTP/mtp-Qwen3.8-27B-Q4_0.gguf, ~1.37GB) living in the *same* repo as
# the main weights. MODEL_SPEC_STRATEGY=mtp here pairs --spec-type draft-mtp
# with this file as an external --model-draft — no other family conf combines
# the two, and it was NOT verified against a live llama.cpp run before being
# turned on by default (2026-09-06). It caused generation pauses, so the
# default is now MODEL_SPEC_STRATEGY=none — and under "none" the draft file
# is NOT loaded at all: it holds only MTP heads, not a standalone model, and
# llama-server segfaults loading it as a plain --model-draft (verified
# 2026-09-23, exit 139 during load_model). The draft is therefore defined
# only when MODEL_SPEC_STRATEGY=mtp (see the draft block below).
#
# NOTE ON MTP AND SMALL QUANTS: Unsloth stripped the embedded MTP modules
# from quants smaller than UD-Q2_K_XL to save ~500MB of disk space. Because this
# script uses the standalone mtp-Qwen3.8-27B-Q4_0.gguf file when
# MODEL_SPEC_STRATEGY=mtp, it bypasses this limitation. The standalone draft
# file is strictly required for MTP on the lowest tiers (UD-IQ2_S, UD-IQ2_XXS, UD-IQ1_S).
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_QWEN38_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_QWEN38_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-none}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-Qwen3.8}"

# KV cache quantization — q8_0 is fine; all Qwen3.8 tiers fit within their VRAM budget.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Per-token KV reserve. Qwen3.8 is a hybrid Gated-DeltaNet model, NOT a plain
# transformer: only 16 of the 64 layers are full attention (the other 48 are
# linear-attention / SSM layers whose fixed-size recurrent state does NOT
# grow with context). So per-token KV grows only from those 16 layers:
#   16 layers × 2 (K+V) × 4 kv heads × 256 head_dim = 32768 bytes/token at q8_0.
# The generic 96 KiB/token default (~98304) assumed all 64 layers and
# over-reserves by ~3x. This is a q8_0 figure — the reserve estimator scales
# it for the active MODEL_KV_TYPE, so it also applies when KV quant changes.
MODEL_KV_BYTES_PER_TOKEN="${MODEL_KV_BYTES_PER_TOKEN:-32768}"

# Jinja chat template — use the model's built-in Jinja template for prompt formatting.
# Qwen3.8's template produces standard JSON tool calls; --jinja is safe and recommended.
MODEL_JINJA="${MODEL_JINJA:-true}"

# Thinking mode — enabled by default, same as the other Qwen families.
# Reasoning tokens before every tool call slow agent loops, so turning it off
# makes turns snappier. (Qwen3.8 has no /think soft switches, so this
# server-side toggle is the only control.)
# The "Thinking mode" question in ai --model overrides this default per
# user (on/off); MODEL_THINKING=false passes --reasoning-budget 0.
MODEL_THINKING="${MODEL_THINKING:-true}"
MODEL_REPEAT_PENALTY="${MODEL_REPEAT_PENALTY:-}"

# Speculative decoding draft — the unsloth repo's MTP/ subfolder ships a
# small Q4_0 draft head (~1.37GB) purpose-built for this exact 27B model.
# MTP reportedly needs ~2GB extra VRAM/RAM headroom over the base tier size.
# Toggled by the spec_decode setting (--setup); MODEL_SPEC_STRATEGY=mtp also
# forces --parallel 1 (see libs/ai-coder-workbench.sh) since MTP doesn't
# support concurrent requests yet.
# Only defined for the mtp strategy: the file is MTP heads, not a standalone
# draft model, and crashes llama-server without --spec-type draft-mtp.
if [ "$MODEL_SPEC_STRATEGY" = "mtp" ]; then
    MODEL_DRAFT_FILE="${MODEL_DRAFT_FILE:-qwen3.8/mtp-Qwen3.8-27B-Q4_0.gguf}"
    MODEL_DRAFT_URL="${MODEL_DRAFT_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/MTP/mtp-Qwen3.8-27B-Q4_0.gguf}"
    MODEL_DRAFT_SHA256="${MODEL_DRAFT_SHA256:-50d9ce5a6da381bbcfb31061cf73df94a90e6faf8efeddee379a9cb8f1501c6e}"
    MODEL_DRAFT_VRAM_GB="${MODEL_DRAFT_VRAM_GB:-2}"
fi

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback. All tiers are the same Qwen3.8-27B dense model at
# different Unsloth Dynamic quant levels (no MoE size point to slot in, unlike
# Qwen3/Qwen3.6 — see the family note above).
#
# Sizes and sha256 below are read directly off the unsloth/Qwen3.8-27B-GGUF
# repo (HF API, blobs=true — real file bytes/hashes, not the model card's
# rounded prose figures, which is why a couple of these differ slightly from
# the original estimates this file shipped with):
#   UD-Q8_K_XL  = 31.46 GB  (new: near-lossless top tier for 40GB+ cards)
#   UD-Q6_K_XL  = 25.30 GB
#   UD-Q5_K_XL  = 20.88 GB
#   UD-Q4_K_XL  = 17.56 GB
#   UD-Q3_K_XL  = 13.15 GB
#   UD-Q2_K_XL  =  9.83 GB
#   UD-IQ2_S    =  8.37 GB  (was UD-IQ2_M, which does not exist in the repo —
#                            the previous MODEL_6 entry would 404 on download)
#   UD-IQ2_XXS  =  7.27 GB
#   UD-IQ1_S    =  6.20 GB  (fallback)
MODEL_COUNT="${MODEL_COUNT:-9}"

# 1 — UD-Q8_K_XL: 31.46 GB; near-lossless 8-bit dynamic quant; fits 40GB+
MODEL_1_FILE="${MODEL_1_FILE:-qwen3.8/Qwen3.8-27B-UD-Q8_K_XL.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q8_K_XL.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-af36ecb6b5db1407953345b746c14ac93f0657dda413910b4348683a2d990377}"
MODEL_1_DESC="${MODEL_1_DESC:-Qwen3.8 27B UD-Q8_K_XL (~31.46GB, near-lossless)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-32}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-64}"

# 2 — UD-Q6_K_XL: 25.30 GB; near-lossless 6-bit dynamic quant; fits 33GB+
MODEL_2_FILE="${MODEL_2_FILE:-qwen3.8/Qwen3.8-27B-UD-Q6_K_XL.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q6_K_XL.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-701d8fa9ed214ab21bfc130cd2a7df19ca89bbef7713e2dfb19f3c63696aa917}"
MODEL_2_DESC="${MODEL_2_DESC:-Qwen3.8 27B UD-Q6_K_XL (~25.30GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-26}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-64}"

# 3 — UD-Q5_K_XL: 20.88 GB; 5-bit dynamic quant; fits 26GB+
MODEL_3_FILE="${MODEL_3_FILE:-qwen3.8/Qwen3.8-27B-UD-Q5_K_XL.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q5_K_XL.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-8601193d3d5760c37fb8ce1b43afebc69df5fb24e1fbc5a547c32e2200305276}"
MODEL_3_DESC="${MODEL_3_DESC:-Qwen3.8 27B UD-Q5_K_XL (~20.88GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-21}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-64}"

# 4 — UD-Q4_K_XL: 17.56 GB; standard 4-bit dynamic quant sweet spot; fits 23GB+
MODEL_4_FILE="${MODEL_4_FILE:-qwen3.8/Qwen3.8-27B-UD-Q4_K_XL.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_XL.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-3f227079003add2511437e5b1e94812e363385225bf6a9b47b0054a72bc8b01e}"
MODEL_4_DESC="${MODEL_4_DESC:-Qwen3.8 27B UD-Q4_K_XL (~17.56GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-18}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-64}"

# 5 — UD-Q3_K_XL: 13.15 GB; 3-bit dynamic quant; fits 18GB+
MODEL_5_FILE="${MODEL_5_FILE:-qwen3.8/Qwen3.8-27B-UD-Q3_K_XL.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q3_K_XL.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-8c2a45ff85e7674ca185ec8eb6cdeab0e617ed9d8018caed0b64380eb2a67a5e}"
MODEL_5_DESC="${MODEL_5_DESC:-Qwen3.8 27B UD-Q3_K_XL (~13.15GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-14}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-64}"

# 6 — UD-Q2_K_XL: 9.83 GB; 2-bit dynamic quant; fits 15GB+
MODEL_6_FILE="${MODEL_6_FILE:-qwen3.8/Qwen3.8-27B-UD-Q2_K_XL.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q2_K_XL.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-fd4730dd8aad070517978752b63d530aeb1740d2283cab9fa24f1e404032ddb0}"
MODEL_6_DESC="${MODEL_6_DESC:-Qwen3.8 27B UD-Q2_K_XL (~9.83GB)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-10}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-64}"

# 7 — UD-IQ2_S: 8.37 GB; 2-bit dynamic quant, smaller than Q2_K_XL; fits 13GB+
MODEL_7_FILE="${MODEL_7_FILE:-qwen3.8/Qwen3.8-27B-UD-IQ2_S.gguf}"
MODEL_7_URL="${MODEL_7_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ2_S.gguf}"
MODEL_7_SHA256="${MODEL_7_SHA256:-7897d2c5a5cee46aef50895141b2c8a0803c1185f3d03c4fda4cd137a7ad77fe}"
MODEL_7_DESC="${MODEL_7_DESC:-Qwen3.8 27B UD-IQ2_S (~8.37GB)}"
MODEL_7_WEIGHTS_GB="${MODEL_7_WEIGHTS_GB:-9}"
MODEL_7_LAYERS="${MODEL_7_LAYERS:-64}"

# 8 — UD-IQ2_XXS: 7.27 GB; 2-bit sub-quant; fits 11GB+
MODEL_8_FILE="${MODEL_8_FILE:-qwen3.8/Qwen3.8-27B-UD-IQ2_XXS.gguf}"
MODEL_8_URL="${MODEL_8_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ2_XXS.gguf}"
MODEL_8_SHA256="${MODEL_8_SHA256:-e792d8fb3142fe6d9171876d6da0f71f05a71028718debc72dbec93ff645e67d}"
MODEL_8_DESC="${MODEL_8_DESC:-Qwen3.8 27B UD-IQ2_XXS (~7.27GB)}"
MODEL_8_WEIGHTS_GB="${MODEL_8_WEIGHTS_GB:-8}"
MODEL_8_LAYERS="${MODEL_8_LAYERS:-64}"

# 9 — UD-IQ1_S: 6.20 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_9_FILE="${MODEL_9_FILE:-qwen3.8/Qwen3.8-27B-UD-IQ1_S.gguf}"
MODEL_9_URL="${MODEL_9_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ1_S.gguf}"
MODEL_9_SHA256="${MODEL_9_SHA256:-}"
MODEL_9_DESC="${MODEL_9_DESC:-Qwen3.8 27B UD-IQ1_S (~6.20GB, fallback)}"
MODEL_9_WEIGHTS_GB="${MODEL_9_WEIGHTS_GB:-0}"
MODEL_9_LAYERS="${MODEL_9_LAYERS:-64}"

# --- [ SGLANG MODELS ] --------------------------------------------------------
# Used instead of the GGUF list above when the engine setting is SGLang
# (--setup). Qwen3.8 ships only the 27B, and SGLang can't run the 2-3 bit
# quants the GGUF list uses for small cards, so the smallest SGLang tier is
# a 4-bit build (~19.5GB): it needs a GPU budget of roughly 24GB+ (e.g. a
# 24GB card at mem-fraction 0.85 is borderline; 32GB is comfortable).
# detect_model warns up front when it can't fit (MODEL_SGL_2_SIZE_GB).
# Pinned to a commit; sizes are the repos' safetensors totals. Tool calls use
# the Qwen3.5+ XML format, hence the qwen3_coder parser. The draft/MTP
# setting above is llama.cpp-only. See config/ai-coder-model.conf for the
# MODEL_SGL_* field reference.
MODEL_SGL_COUNT="${MODEL_SGL_COUNT:-2}"
MODEL_SGL_TOOL_PARSER="${MODEL_SGL_TOOL_PARSER:-qwen3_coder}"
MODEL_SGL_REASONING_PARSER="${MODEL_SGL_REASONING_PARSER:-qwen3}"

# 1 — Qwen3.8 27B FP8 (official Qwen release): 30.9 GB
MODEL_SGL_1_REPO="${MODEL_SGL_1_REPO:-Qwen/Qwen3.8-27B-FP8}"
MODEL_SGL_1_REVISION="${MODEL_SGL_1_REVISION:-017b9c7af6b5689d5dd426a76e0bc077eb5ca20a}"
MODEL_SGL_1_DESC="${MODEL_SGL_1_DESC:-Qwen3.8 27B FP8 (~30.9GB)}"
MODEL_SGL_1_WEIGHTS_GB="${MODEL_SGL_1_WEIGHTS_GB:-31}"

# 2 — Qwen3.8 27B INT4 W4A16 (Red Hat): 19.5 GB; fallback (WEIGHTS_GB=0)
MODEL_SGL_2_REPO="${MODEL_SGL_2_REPO:-RedHatAI/Qwen3.8-27B-INT4}"
MODEL_SGL_2_REVISION="${MODEL_SGL_2_REVISION:-2f0fa48fea4949b56685ddfc48c05dd81c7d772b}"
MODEL_SGL_2_DESC="${MODEL_SGL_2_DESC:-Qwen3.8 27B INT4 W4A16 (~19.5GB, fallback)}"
MODEL_SGL_2_WEIGHTS_GB="${MODEL_SGL_2_WEIGHTS_GB:-0}"
MODEL_SGL_2_SIZE_GB="${MODEL_SGL_2_SIZE_GB:-20}"