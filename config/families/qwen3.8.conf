#!/bin/bash
# ==============================================================================
# QWEN3.8.CONF | Qwen3.8 Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for Qwen3.8.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# Qwen3.8 (released August 2026) is built on the Qwen3.5 architectural
# foundation and ships two variants:
#
#   Qwen3.8-27B        — dense, deployment-friendly, native vision-language
#                         model with flexible thinking control. The only
#                         variant that's consumer-GPU feasible; used for
#                         every tier below.
#   Qwen3.8-2.4T-A95B   — MoE "Qwen-Max-class" open release (2.4T total /
#                         95B active). Not wired here: even the lowest-bit
#                         GGUF quants run 400GB-2.6TB+, far beyond any
#                         single-GPU workbench this project targets.
#
# Context length: 262,144 tokens natively; extensible to 1,000,000 via YaRN.
#
# Thinking behaviour:
#   Thinking mode is enabled by default and tunable per request (no /think
#   or /no_think chat-template soft switches, per unsloth's docs) — same
#   server-side toggle pattern as Qwen3.6: pass enable_thinking: false in
#   the API request body to disable.
#
# Includes a vision encoder (image + video input supported).
#
# GGUF quants use Unsloth Dynamic V3.0 (preview); sizes below are sourced
# from the unsloth/Qwen3.8-27B-GGUF model card (August 2026).
#
# Speculative decoding: MTP is available for Qwen3.8-27B upstream, but no
# unsloth *-MTP-GGUF repo for it has appeared yet (unlike Qwen3.6). Left on
# "ngram" for now; revisit once/if a Qwen3.8 MTP GGUF is published.
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_QWEN38_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_QWEN38_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-ngram}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-Qwen3.8}"

# KV cache quantization — q8_0 is fine; all Qwen3.8 tiers fit within their VRAM budget.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Jinja chat template — use the model's built-in Jinja template for prompt formatting.
# Qwen3.8's template produces standard JSON tool calls; --jinja is safe and recommended.
MODEL_JINJA="${MODEL_JINJA:-true}"

# Thinking mode — disabled by default for agent use: reasoning tokens before
# every tool call make agent loops sluggish. (Qwen3.8 has no /think soft
# switches, so this server-side toggle is the only control.)
# Set MODEL_THINKING=true to re-enable for harder planning-heavy tasks.
MODEL_THINKING="${MODEL_THINKING:-true}"

# No speculative-decoding draft wired: no small Qwen3.8 dense model exists,
# and the upstream MTP variant hasn't shown up as an unsloth GGUF repo yet.
# Define MODEL_DRAFT_FILE/URL manually if a compatible small model appears.

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback. All tiers are the same Qwen3.8-27B dense model at
# different Unsloth Dynamic quant levels (no MoE size point to slot in, unlike
# Qwen3/Qwen3.6 — see the family note above).
#
# Sizes sourced from the unsloth/Qwen3.8-27B-GGUF model card (August 2026):
#   UD-Q6_K_XL  = 25.9 GB
#   UD-Q5_K_XL  = 20.2 GB
#   UD-Q4_K_XL  = 17.9 GB
#   UD-Q3_K_XL  = 13.4 GB
#   UD-Q2_K_XL  = 10.7 GB
#   UD-IQ2_M    = 10.3 GB
#   UD-IQ2_XXS  =  9.01 GB  (fallback)
MODEL_COUNT="${MODEL_COUNT:-7}"

# 1 — UD-Q6_K_XL: 25.9 GB; near-lossless 6-bit dynamic quant; fits 33GB+
MODEL_1_FILE="${MODEL_1_FILE:-qwen3.8/Qwen3.8-27B-UD-Q6_K_XL.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q6_K_XL.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-}"
MODEL_1_DESC="${MODEL_1_DESC:-Qwen3.8 27B UD-Q6_K_XL (~25.9GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-26}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-64}"

# 2 — UD-Q5_K_XL: 20.2 GB; 5-bit dynamic quant; fits 26GB+
MODEL_2_FILE="${MODEL_2_FILE:-qwen3.8/Qwen3.8-27B-UD-Q5_K_XL.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q5_K_XL.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-}"
MODEL_2_DESC="${MODEL_2_DESC:-Qwen3.8 27B UD-Q5_K_XL (~20.2GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-21}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-64}"

# 3 — UD-Q4_K_XL: 17.9 GB; standard 4-bit dynamic quant sweet spot; fits 23GB+
MODEL_3_FILE="${MODEL_3_FILE:-qwen3.8/Qwen3.8-27B-UD-Q4_K_XL.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q4_K_XL.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-}"
MODEL_3_DESC="${MODEL_3_DESC:-Qwen3.8 27B UD-Q4_K_XL (~17.9GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-18}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-64}"

# 4 — UD-Q3_K_XL: 13.4 GB; 3-bit dynamic quant; fits 18GB+
MODEL_4_FILE="${MODEL_4_FILE:-qwen3.8/Qwen3.8-27B-UD-Q3_K_XL.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q3_K_XL.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-}"
MODEL_4_DESC="${MODEL_4_DESC:-Qwen3.8 27B UD-Q3_K_XL (~13.4GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-14}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-64}"

# 5 — UD-Q2_K_XL: 10.7 GB; 2-bit dynamic quant; fits 15GB+
MODEL_5_FILE="${MODEL_5_FILE:-qwen3.8/Qwen3.8-27B-UD-Q2_K_XL.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-Q2_K_XL.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-}"
MODEL_5_DESC="${MODEL_5_DESC:-Qwen3.8 27B UD-Q2_K_XL (~10.7GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-11}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-64}"

# 6 — UD-IQ2_M: 10.3 GB; slightly smaller 2-bit dynamic quant; fits 14GB+
MODEL_6_FILE="${MODEL_6_FILE:-qwen3.8/Qwen3.8-27B-UD-IQ2_M.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ2_M.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-}"
MODEL_6_DESC="${MODEL_6_DESC:-Qwen3.8 27B UD-IQ2_M (~10.3GB)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-11}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-64}"

# 7 — UD-IQ2_XXS: 9.01 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_7_FILE="${MODEL_7_FILE:-qwen3.8/Qwen3.8-27B-UD-IQ2_XXS.gguf}"
MODEL_7_URL="${MODEL_7_URL:-https://huggingface.co/unsloth/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-UD-IQ2_XXS.gguf}"
MODEL_7_SHA256="${MODEL_7_SHA256:-}"
MODEL_7_DESC="${MODEL_7_DESC:-Qwen3.8 27B UD-IQ2_XXS (~9.01GB, fallback)}"
MODEL_7_WEIGHTS_GB="${MODEL_7_WEIGHTS_GB:-0}"
MODEL_7_LAYERS="${MODEL_7_LAYERS:-64}"
