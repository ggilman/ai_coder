#!/bin/bash
# ==============================================================================
# DEEPSEEK_V2_LITE.CONF | DeepSeek-Coder-V2 Lite 16B Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for 
# DeepSeek-Coder-V2 Lite.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# DeepSeek-Coder-V2 Lite (16B total parameters, 2.4B active during generation)
# is a highly efficient Mixture-of-Experts (MoE) model. Because it only activates
# 2.4B parameters per token, it offers exceptionally fast inference while matching
# the reasoning capabilities of much larger dense models.
#
# Context length: 128,000 tokens natively.
#
# KV Cache & Architecture Note:
#   DeepSeek-V2 utilizes Multi-head Latent Attention (MLA), which significantly 
#   compresses the KV cache footprint compared to standard transformers or 
#   grouped-query attention (GQA). 
#
# Speculative decoding: 
#   Not currently paired with a dedicated draft model in this configuration, 
#   as the 2.4B active parameter footprint natively generates tokens fast enough 
#   on consumer GPUs to negate the need for draft overhead.
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_DS_V2_LITE_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_DS_V2_LITE_CONF_LOADED=1

# Speculative Decoding Strategy
# Defaulting to none for DeepSeek MoE models.
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-none}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-DeepSeek-Coder-V2-Lite}"

# KV cache quantization
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Per-token KV reserve. DeepSeek's MLA drastically reduces this requirement.
# Set lower than standard dense models to reflect the compressed latent state.
MODEL_KV_BYTES_PER_TOKEN="${MODEL_KV_BYTES_PER_TOKEN:-16384}"

# Jinja chat template — ENABLED. DeepSeek-Coder-V2's tool calls use the
# <｜tool▁calls▁>/<｜tool▁call▁> special-token format, which only the model's
# built-in Jinja template renders correctly. With --jinja off, llama.cpp's
# internal (non-jinja) format handler doesn't know this template, so the model
# leaks raw <｜...｜> tokens into the visible response instead of proper
# tool_calls. MODEL_JINJA is therefore true: the built-in template renders the
# native format and llama.cpp converts it to OpenAI-style tool_calls for
# agents like opencode. (Contrast config/families/llama4.conf, whose XML
# <function=...> template the internal handler handles fine with jinja off.)
MODEL_JINJA="${MODEL_JINJA:-true}"
# No repeat penalty: it penalizes legitimately repeated tokens (indentation,
# identifiers, JSON keys) and is a known cause of malformed tool calls.
MODEL_REPEAT_PENALTY="${MODEL_REPEAT_PENALTY:-}"

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback. 
#
# Because this is a 16B MoE model, the files are notably smaller than a 27B dense
# model, meaning higher precision quants (like Q8_0) can be comfortably run on 
# 24GB or even 16GB VRAM cards.
# 
# Estimated sizes (based on standard GGUF MoE compression):
#   Q8_0    ~ 16.50 GB  (Fits 24GB cards beautifully)
#   Q6_K    ~ 12.50 GB  (Fits 16GB cards)
#   Q5_K_M  ~ 11.00 GB
#   Q4_K_M  ~  9.50 GB  (The sweet spot for 12GB cards)
#   Q3_K_M  ~  7.50 GB
#   Q2_K    ~  6.00 GB  (Fallback)

MODEL_COUNT="${MODEL_COUNT:-6}"

# 1 — Q8_0: 16.50 GB; near-lossless 8-bit quant; excellent for 24GB cards
MODEL_1_FILE="${MODEL_1_FILE:-deepseek-coder-v2/DeepSeek-Coder-V2-Lite-Instruct-Q8_0.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q8_0.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-}"
MODEL_1_DESC="${MODEL_1_DESC:-DeepSeek-Coder-V2 Lite 16B Q8_0 (~16.5GB, near-lossless)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-17}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-28}"

# 2 — Q6_K: 12.50 GB; near-lossless 6-bit quant; fits 16GB+
MODEL_2_FILE="${MODEL_2_FILE:-deepseek-coder-v2/DeepSeek-Coder-V2-Lite-Instruct-Q6_K.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q6_K.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-}"
MODEL_2_DESC="${MODEL_2_DESC:-DeepSeek-Coder-V2 Lite 16B Q6_K (~12.5GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-13}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-28}"

# 3 — Q5_K_M: 11.00 GB; 5-bit quant
MODEL_3_FILE="${MODEL_3_FILE:-deepseek-coder-v2/DeepSeek-Coder-V2-Lite-Instruct-Q5_K_M.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q5_K_M.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-}"
MODEL_3_DESC="${MODEL_3_DESC:-DeepSeek-Coder-V2 Lite 16B Q5_K_M (~11.0GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-11}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-28}"

# 4 — Q4_K_M: 9.50 GB; standard 4-bit sweet spot; fits 12GB+
MODEL_4_FILE="${MODEL_4_FILE:-deepseek-coder-v2/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q4_K_M.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-}"
MODEL_4_DESC="${MODEL_4_DESC:-DeepSeek-Coder-V2 Lite 16B Q4_K_M (~9.5GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-10}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-28}"

# 5 — Q3_K_M: 7.50 GB; 3-bit quant
MODEL_5_FILE="${MODEL_5_FILE:-deepseek-coder-v2/DeepSeek-Coder-V2-Lite-Instruct-Q3_K_M.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q3_K_M.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-}"
MODEL_5_DESC="${MODEL_5_DESC:-DeepSeek-Coder-V2 Lite 16B Q3_K_M (~7.5GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-8}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-28}"

# 6 — Q2_K: 6.00 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_6_FILE="${MODEL_6_FILE:-deepseek-coder-v2/DeepSeek-Coder-V2-Lite-Instruct-Q2_K.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/bartowski/DeepSeek-Coder-V2-Lite-Instruct-GGUF/resolve/main/DeepSeek-Coder-V2-Lite-Instruct-Q2_K.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-}"
MODEL_6_DESC="${MODEL_6_DESC:-DeepSeek-Coder-V2 Lite 16B Q2_K (~6.0GB, fallback)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-0}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-28}"

# --- [ SGLANG MODELS ] --------------------------------------------------------
# For setups utilizing SGLang instead of llama.cpp
MODEL_SGL_COUNT="${MODEL_SGL_COUNT:-1}"
MODEL_SGL_TOOL_PARSER="${MODEL_SGL_TOOL_PARSER:-deepseek_coder}"
MODEL_SGL_REASONING_PARSER="${MODEL_SGL_REASONING_PARSER:-none}"

# 1 — DeepSeek-Coder-V2 Lite 16B FP8
MODEL_SGL_1_REPO="${MODEL_SGL_1_REPO:-deepseek-ai/DeepSeek-Coder-V2-Lite-Instruct}"
MODEL_SGL_1_REVISION="${MODEL_SGL_1_REVISION:-main}"
MODEL_SGL_1_DESC="${MODEL_SGL_1_DESC:-DeepSeek-Coder-V2 Lite 16B BF16 (~32GB)}"
MODEL_SGL_1_WEIGHTS_GB="${MODEL_SGL_1_WEIGHTS_GB:-0}"
MODEL_SGL_1_SIZE_GB="${MODEL_SGL_1_SIZE_GB:-32}"