#!/bin/bash
# ==============================================================================
# QWEN2.5_CODER.CONF | Qwen2.5-Coder Instruct Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for Qwen2.5-Coder.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# To add a new model family, create a new .conf file in this directory using
# this file as a template. It will be auto-discovered by the family selection
# menu on next run (or immediately with --menu).
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_QWEN25_CODER_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_QWEN25_CODER_CONF_LOADED=1

# --- [ MODEL FAMILY ] ---------------------------------------------------------
# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-Qwen 2.5 Coder}"

# KV cache quantization — q8_0 is fine.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Qwen2.5-Coder uses standard attention with RoPE. 
# Estimated around 96 KiB/token for full precision, scaled appropriately for q8_0 KV.
MODEL_KV_BYTES_PER_TOKEN="${MODEL_KV_BYTES_PER_TOKEN:-50176}"

# Jinja chat template — Qwen2.5 uses the ChatML format, which handles system 
# prompts and tool calls perfectly when --jinja is active.
MODEL_JINJA="${MODEL_JINJA:-true}"

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback.

MODEL_COUNT="${MODEL_COUNT:-8}"

# 1 — 32B Q6_K: ~26.4 GB; dense near-lossless 6-bit; fits 32GB+
MODEL_1_FILE="${MODEL_1_FILE:-qwen2.5-coder-32b-instruct-q6_k.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-32B-Instruct-GGUF/resolve/main/qwen2.5-coder-32b-instruct-q6_k.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-38c1555adabcc7e9dfdae217cfbfdea53c97996a1ca17bd00125cf32bbdc63c2}"
MODEL_1_DESC="${MODEL_1_DESC:-Qwen2.5-Coder 32B Q6_K (~26.4GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-27}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-64}"

# 2 — 32B Q5_K_M: ~23.3 GB; dense 5-bit; fits 28GB+
MODEL_2_FILE="${MODEL_2_FILE:-qwen2.5-coder-32b-instruct-q5_k_m.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-32B-Instruct-GGUF/resolve/main/qwen2.5-coder-32b-instruct-q5_k_m.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-67f5470b8d17b37fb49e76ad797dd6eda93997499c3031aa33a6ac3f77804668}"
MODEL_2_DESC="${MODEL_2_DESC:-Qwen2.5-Coder 32B Q5_K_M (~23.3GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-24}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-64}"

# 3 — 32B Q4_K_M: ~19.5 GB; dense 4-bit; fits 24GB+
MODEL_3_FILE="${MODEL_3_FILE:-qwen2.5-coder-32b-instruct-q4_k_m.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-32B-Instruct-GGUF/resolve/main/qwen2.5-coder-32b-instruct-q4_k_m.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-4d64b316b5e6319d9613e0d97935d9ebd631fc7e334da400d00085eca749d085}"
MODEL_3_DESC="${MODEL_3_DESC:-Qwen2.5-Coder 32B Q4_K_M (~19.5GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-20}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-64}"

# 4 — 14B Q6_K: ~12.2 GB; dense 6-bit; fits 16GB+
MODEL_4_FILE="${MODEL_4_FILE:-qwen2.5-coder-14b-instruct-q6_k.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/qwen2.5-coder-14b-instruct-q6_k.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-302a079369ad8b66c8e8ec1bfa62d109c64d8015e9bfd52d9c6cf4c6c9f36b5f}"
MODEL_4_DESC="${MODEL_4_DESC:-Qwen2.5-Coder 14B Q6_K (~12.2GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-13}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-48}"

# 5 — 14B Q5_K_M: ~10.4 GB; dense 5-bit; fits 16GB+ 
MODEL_5_FILE="${MODEL_5_FILE:-qwen2.5-coder-14b-instruct-q5_k_m.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/qwen2.5-coder-14b-instruct-q5_k_m.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-98ab25e0132e3f1e6d3554e1b64de2b5021908819b740d9c208430117e49a775}"
MODEL_5_DESC="${MODEL_5_DESC:-Qwen2.5-Coder 14B Q5_K_M (~10.4GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-11}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-48}"

# 6 — 14B Q4_K_M: ~8.6 GB; dense 4-bit; fits 12GB+
MODEL_6_FILE="${MODEL_6_FILE:-qwen2.5-coder-14b-instruct-q4_k_m.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-14B-Instruct-GGUF/resolve/main/qwen2.5-coder-14b-instruct-q4_k_m.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-c1e659736d89ac1065fb495330fb824d94001974a4bfa78e7270e43476a8d940}"
MODEL_6_DESC="${MODEL_6_DESC:-Qwen2.5-Coder 14B Q4_K_M (~8.6GB)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-9}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-48}"

# 7 — 7B Q5_K_M: ~5.4 GB; dense 5-bit; fits 8GB+
MODEL_7_FILE="${MODEL_7_FILE:-qwen2.5-coder-7b-instruct-q5_k_m.gguf}"
MODEL_7_URL="${MODEL_7_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q5_k_m.gguf}"
MODEL_7_SHA256="${MODEL_7_SHA256:-586844eac4d6d6321689f0192c8aa8e69cd8625974a5cc2d925b1a03366e4d16}"
MODEL_7_DESC="${MODEL_7_DESC:-Qwen2.5-Coder 7B Q5_K_M (~5.4GB)}"
MODEL_7_WEIGHTS_GB="${MODEL_7_WEIGHTS_GB:-6}"
MODEL_7_LAYERS="${MODEL_7_LAYERS:-28}"

# 8 — 7B Q4_K_M: ~4.7 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_8_FILE="${MODEL_8_FILE:-qwen2.5-coder-7b-instruct-q4_k_m.gguf}"
MODEL_8_URL="${MODEL_8_URL:-https://huggingface.co/Qwen/Qwen2.5-Coder-7B-Instruct-GGUF/resolve/main/qwen2.5-coder-7b-instruct-q4_k_m.gguf}"
MODEL_8_SHA256="${MODEL_8_SHA256:-509287f78cb4d4cf6b3843734733b914b2c158e43e22a7f4bf5e963800894d3c}"
MODEL_8_DESC="${MODEL_8_DESC:-Qwen2.5-Coder 7B Q4_K_M (~4.7GB, fallback)}"
MODEL_8_WEIGHTS_GB="${MODEL_8_WEIGHTS_GB:-0}"
MODEL_8_LAYERS="${MODEL_8_LAYERS:-28}"
