MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-df27a780435b7b45c2597536112ea3cb091f8544c3d0c3318d9f4258b31f7adf}"
MODEL_4_DESC="${MODEL_4_DESC:-Qwen3.6 35B-A3B MTP UD-IQ4_XS MoE (~19.2GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-20}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-40}"

# 5 — 35B-A3B MTP UD-Q3_K_S: ~16.8 GB VRAM requirement
MODEL_5_FILE="${MODEL_5_FILE:-Qwen3.6-35B-A3B-UD-Q3_K_S.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q3_K_S.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-}"
MODEL_5_DESC="${MODEL_5_DESC:-Qwen3.6 35B-A3B MTP UD-Q3_K_S MoE (~16.8GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-17}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-40}"

# 6 — 35B-A3B MTP UD-IQ2_XXS: ~12.2 GB VRAM requirement
