#!/bin/bash
# ==============================================================================
# QWEN3.6-MTP.CONF | Qwen3.6 MTP (Multi-Token Prediction) Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for Qwen3.6 MTP.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# Qwen3.6 MTP models include built-in draft heads for speculative decoding,
# delivering ~1.5x to 2x faster inference speeds without sacrificing accuracy.
#
# IMPORTANT — MTP VRAM Overhead:
#   The embedded MTP draft layers require roughly 1GB to 2GB of additional
#   VRAM compared to the standard Qwen3.6 GGUFs. The weights below have been
#   adjusted to reflect the larger memory requirements.
#
# Required llama.cpp launch flags for MTP:
#   To activate the MTP layers, you MUST pass the following flags to your server:
#   --spec-type draft-mtp --spec-draft-n-max 2
#   (Note: -np > 1 and --mmproj are currently unsupported when using MTP)

# Guard against double-sourcing
[ "${_AI_CODER_QWEN36_MTP_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_QWEN36_MTP_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-mtp}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

MODEL_FAMILY="${MODEL_FAMILY:-Qwen3.6 MTP}"
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"
MODEL_JINJA="${MODEL_JINJA:-true}"
MODEL_THINKING="${MODEL_THINKING:-true}"

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------

MODEL_COUNT="${MODEL_COUNT:-7}"

# 1 — 35B-A3B MTP UD-Q6_K: ~30.8 GB VRAM requirement
MODEL_1_FILE="${MODEL_1_FILE:-Qwen3.6-35B-A3B-UD-Q6_K.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q6_K.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-49935b04ad883c2f3d4da61f65b609d447dad67d0b08453b90abb09a1bb35464}"
MODEL_1_DESC="${MODEL_1_DESC:-Qwen3.6 35B-A3B MTP UD-Q6_K MoE (~30.8GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-31}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-40}"

# 2 — 35B-A3B MTP UD-Q5_K_S: ~26.4 GB VRAM requirement
MODEL_2_FILE="${MODEL_2_FILE:-Qwen3.6-35B-A3B-UD-Q5_K_S.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q5_K_S.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-b773526fab7e47cd2da8f51c20f986f7912f0aee56811265839650c4bfd1a098}"
MODEL_2_DESC="${MODEL_2_DESC:-Qwen3.6 35B-A3B MTP UD-Q5_K_S MoE (~26.4GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-27}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-40}"

# 3 — 35B-A3B MTP UD-Q4_K_M: ~23.5 GB VRAM requirement
MODEL_3_FILE="${MODEL_3_FILE:-Qwen3.6-35B-A3B-UD-Q4_K_M.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/unsloth/Qwen3.6-35B-A3B-MTP-GGUF/resolve/main/Qwen3.6-35B-A3B-UD-Q4_K_M.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-0b21525e972670ed59e1812e170b27c26355381f0656ecc4e25617ece7dac58b}"
MODEL_3_DESC="${MODEL_3_DESC:-Qwen3.6 35B-A3B MTP UD-Q4_K_M MoE (~23.5GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-24}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-40}"

# 4 — 35B-A3B MTP UD-IQ4_XS: ~19.2 GB VRAM requirement
