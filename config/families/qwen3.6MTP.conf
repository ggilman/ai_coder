MODEL_6_SHA256="${MODEL_6_SHA256:-}"
MODEL_6_DESC="${MODEL_6_DESC:-Qwen3.6 35B-A3B MTP UD-IQ2_XXS MoE (~12.2GB)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-13}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-40}"

# 7 — 27B MTP UD-IQ2_XXS: ~10.8 GB VRAM requirement (fallback)
MODEL_7_FILE="${MODEL_7_FILE:-Qwen3.6-27B-UD-IQ2_XXS.gguf}"
MODEL_7_URL="${MODEL_7_URL:-https://huggingface.co/unsloth/Qwen3.6-27B-MTP-GGUF/resolve/main/Qwen3.6-27B-UD-IQ2_XXS.gguf}"
MODEL_7_SHA256="${MODEL_7_SHA256:-844907b21d12669ce23de622e13d923581112b465f245bee1d0d84d519327b6f}"
MODEL_7_DESC="${MODEL_7_DESC:-Qwen3.6 27B MTP UD-IQ2_XXS (~10.8GB, fallback)}"
MODEL_7_WEIGHTS_GB="${MODEL_7_WEIGHTS_GB:-0}"
MODEL_7_LAYERS="${MODEL_7_LAYERS:-64}"