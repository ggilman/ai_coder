#!/bin/bash
# ==============================================================================
# GEMMA4.CONF | Gemma 4 Model Family Configuration
# ==============================================================================
# Defines the model family identity and per-VRAM-tier model files for Gemma 4.
# Sourced by ai-coder after family selection, following config/ai-coder-model.conf.
#
# To add a new model family, create a new .conf file in this directory using
# this file as a template. It will be auto-discovered by the family selection
# menu on next run (or immediately with --model).
#
# Every setting can be overridden by exporting the variable before invoking
# ai-coder — the ${VAR:-default} pattern means the env var wins when set.

# Guard against double-sourcing
[ "${_AI_CODER_GEMMA4_CONF_LOADED:-}" = "1" ] && return 0
readonly _AI_CODER_GEMMA4_CONF_LOADED=1

# Speculative Decoding Strategy
# Defines how ai-coder accelerates token generation.
# Options: mtp, ngram, or none
# ngram: the unsloth Gemma 4 GGUFs carry no MTP layers (llama-server refuses
# draft-mtp on them), and agent turns re-emit a lot of in-context code,
# which is where ngram's prompt-lookup drafts pay off.
MODEL_SPEC_STRATEGY="${MODEL_SPEC_STRATEGY:-ngram}"

# --- [ MODEL FAMILY ] ---------------------------------------------------------

# Display name shown in the family selection menu, status messages, and logs.
MODEL_FAMILY="${MODEL_FAMILY:-Gemma 4}"

# KV cache quantization — q8_0 is fine; Gemma 4 models fit well within their tier VRAM.
MODEL_KV_TYPE="${MODEL_KV_TYPE:-q8_0}"

# Gemma 4 uses interleaved sliding-window attention: only ~1 in 6 layers
# keeps full-context KV. Each tier's MODEL_N_KV / MODEL_N_KV_SWA (written by
# --kv-probe) captures that; the 31B's figure matches the ~6.1 GiB measured
# at 131072 ctx with q8_0 under llama.cpp. SGLang caches sliding layers far
# less frugally (a fixed 0.8 share of the context, not the window), so its
# Gemma 4 tiers need much more KV VRAM for a long context.

# Jinja chat template — use the model's built-in Jinja template for prompt formatting.
# Gemma 4's template produces standard JSON tool calls; --jinja is safe and recommended.
MODEL_JINJA="${MODEL_JINJA:-true}"

# Sampling (engine defaults, see MODEL_SAMPLING in config/ai-coder-model.conf):
# the Gemma 4 model card's single recommended set (temperature 1.0, top_p
# 0.95, top_k 64) for every use case, thinking or not. The card sets no min_p;
# min_p=0 turns off llama.cpp's own default of 0.05 so the card's filters are
# the only ones applied.
MODEL_SAMPLING="${MODEL_SAMPLING:-temp=1.0 top_p=0.95 top_k=64 min_p=0}"

# No speculative-decoding draft wired: the smallest gemma-4 (E2B, ~2B
# effective) is too large to pay off as a draft. Define MODEL_DRAFT_FILE/URL
# manually if a sub-1B gemma-4 model appears.

# --- [ TIER MODEL DEFINITIONS ] -----------------------------------------------
# Each tier has these variables:
#   MODEL_N_DESC  — human-readable label shown in logs and menus
#   MODEL_N_SHA256 — expected sha256, verified after download (blank = skip)
#
# Models listed best-quality-first. The last entry (MODEL_N_WEIGHTS_GB=0) is the
# unconditional fallback.
#
# Sizes sourced from unsloth HuggingFace repos:
#   31B  Q6_K           = 25.2  GB
#   31B  Q5_K_M         = 21.7  GB
#   31B  Q4_K_M         = 18.3  GB
#   26B-A4B UD-Q4_K_M   = 16.9  GB
#   26B-A4B UD-IQ4_XS   = 13.6  GB
#   26B-A4B UD-Q3_K_M   = 12.7  GB
#   12B  Q5_K_M         =  8.41 GB
#   E2B  Q4_K_M         =  3.11 GB
MODEL_COUNT="${MODEL_COUNT:-8}"

# 1 — 31B Q6_K: 25.2 GB; dense near-lossless 6-bit; fits 32GB+
MODEL_1_FILE="${MODEL_1_FILE:-gemma4/gemma-4-31B-it-Q6_K.gguf}"
MODEL_1_URL="${MODEL_1_URL:-https://huggingface.co/unsloth/gemma-4-31B-it-GGUF/resolve/main/gemma-4-31B-it-Q6_K.gguf}"
MODEL_1_SHA256="${MODEL_1_SHA256:-4660692bca96f1d9d19c550641088789c8c0c25bb07965a1e2798e3cb16885fb}"
MODEL_1_DESC="${MODEL_1_DESC:-Gemma-4 31B Q6_K (~25.2GB)}"
MODEL_1_WEIGHTS_GB="${MODEL_1_WEIGHTS_GB:-26}"
MODEL_1_LAYERS="${MODEL_1_LAYERS:-60}"
MODEL_1_KV="${MODEL_1_KV:-20480/20480}"
MODEL_1_KV_SWA="${MODEL_1_KV_SWA:-204800/204800@1024}"

# 2 — 31B Q5_K_M: 21.7 GB; dense 5-bit; fits 28GB+
MODEL_2_FILE="${MODEL_2_FILE:-gemma4/gemma-4-31B-it-Q5_K_M.gguf}"
MODEL_2_URL="${MODEL_2_URL:-https://huggingface.co/unsloth/gemma-4-31B-it-GGUF/resolve/main/gemma-4-31B-it-Q5_K_M.gguf}"
MODEL_2_SHA256="${MODEL_2_SHA256:-95192e41190ef5eb72db92b669cea0ed733049c2265a03a64ac5a080d8605958}"
MODEL_2_DESC="${MODEL_2_DESC:-Gemma-4 31B Q5_K_M (~21.7GB)}"
MODEL_2_WEIGHTS_GB="${MODEL_2_WEIGHTS_GB:-22}"
MODEL_2_LAYERS="${MODEL_2_LAYERS:-60}"
MODEL_2_KV="${MODEL_2_KV:-20480/20480}"
MODEL_2_KV_SWA="${MODEL_2_KV_SWA:-204800/204800@1024}"

# 3 — 31B Q4_K_M: 18.3 GB; dense 4-bit; fits 25GB+
MODEL_3_FILE="${MODEL_3_FILE:-gemma4/gemma-4-31B-it-Q4_K_M.gguf}"
MODEL_3_URL="${MODEL_3_URL:-https://huggingface.co/unsloth/gemma-4-31B-it-GGUF/resolve/main/gemma-4-31B-it-Q4_K_M.gguf}"
MODEL_3_SHA256="${MODEL_3_SHA256:-38bd64c852c4b460434cc7162fa9bdcf242faf86502581a754cb72956bb17f84}"
MODEL_3_DESC="${MODEL_3_DESC:-Gemma-4 31B Q4_K_M (~18.3GB)}"
MODEL_3_WEIGHTS_GB="${MODEL_3_WEIGHTS_GB:-19}"
MODEL_3_LAYERS="${MODEL_3_LAYERS:-60}"
MODEL_3_KV="${MODEL_3_KV:-20480/20480}"
MODEL_3_KV_SWA="${MODEL_3_KV_SWA:-204800/204800@1024}"

# 4 — 26B-A4B UD-Q4_K_M: 16.9 GB; MoE (3.8B active), Q4_K_M quality; fits 23GB+ (3090/4090)
MODEL_4_FILE="${MODEL_4_FILE:-gemma4/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf}"
MODEL_4_URL="${MODEL_4_URL:-https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-Q4_K_M.gguf}"
MODEL_4_SHA256="${MODEL_4_SHA256:-f2c28b3dc4776931ac6f879e11f203dec637ea0f14267a86ec8f6165f63f293f}"
MODEL_4_DESC="${MODEL_4_DESC:-Gemma-4 26B A4B UD-Q4_K_M (~16.9GB)}"
MODEL_4_WEIGHTS_GB="${MODEL_4_WEIGHTS_GB:-17}"
MODEL_4_LAYERS="${MODEL_4_LAYERS:-30}"
MODEL_4_KV="${MODEL_4_KV:-5120/5120}"
MODEL_4_KV_SWA="${MODEL_4_KV_SWA:-51200/51200@1024}"

# 5 — 26B-A4B UD-IQ4_XS: 13.6 GB; MoE (3.8B active), near-4B speed; fits 20GB+
MODEL_5_FILE="${MODEL_5_FILE:-gemma4/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf}"
MODEL_5_URL="${MODEL_5_URL:-https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf}"
MODEL_5_SHA256="${MODEL_5_SHA256:-babd1e389d386352f71600765d37390f7dc993fbfad6725caccf996ffe34aecf}"
MODEL_5_DESC="${MODEL_5_DESC:-Gemma-4 26B A4B UD-IQ4_XS (~13.6GB)}"
MODEL_5_WEIGHTS_GB="${MODEL_5_WEIGHTS_GB:-14}"
MODEL_5_LAYERS="${MODEL_5_LAYERS:-30}"
MODEL_5_KV="${MODEL_5_KV:-5120/5120}"
MODEL_5_KV_SWA="${MODEL_5_KV_SWA:-51200/51200@1024}"

# 6 — 26B-A4B UD-Q3_K_M: 12.7 GB; MoE 3-bit; fits 19GB+
MODEL_6_FILE="${MODEL_6_FILE:-gemma4/gemma-4-26B-A4B-it-UD-Q3_K_M.gguf}"
MODEL_6_URL="${MODEL_6_URL:-https://huggingface.co/unsloth/gemma-4-26B-A4B-it-GGUF/resolve/main/gemma-4-26B-A4B-it-UD-Q3_K_M.gguf}"
MODEL_6_SHA256="${MODEL_6_SHA256:-811882f6df81c8ea204a5d382f196d6bd601245091786912d4c70df41cdfa052}"
MODEL_6_DESC="${MODEL_6_DESC:-Gemma-4 26B A4B UD-Q3_K_M (~12.7GB)}"
MODEL_6_WEIGHTS_GB="${MODEL_6_WEIGHTS_GB:-13}"
MODEL_6_LAYERS="${MODEL_6_LAYERS:-30}"
MODEL_6_KV="${MODEL_6_KV:-5120/5120}"
MODEL_6_KV_SWA="${MODEL_6_KV_SWA:-51200/51200@1024}"

# 7 — 12B Q5_K_M: 8.41 GB; unified multimodal dense; fits 15GB+ (4080)
MODEL_7_FILE="${MODEL_7_FILE:-gemma4/gemma-4-12b-it-Q5_K_M.gguf}"
MODEL_7_URL="${MODEL_7_URL:-https://huggingface.co/unsloth/gemma-4-12b-it-GGUF/resolve/main/gemma-4-12b-it-Q5_K_M.gguf}"
MODEL_7_SHA256="${MODEL_7_SHA256:-32c554c7d1338a23837ae39b3db482213a4a642f96df3b2619f516a2375d16cd}"
MODEL_7_DESC="${MODEL_7_DESC:-Gemma-4 12B Q5_K_M (~8.41GB)}"
MODEL_7_WEIGHTS_GB="${MODEL_7_WEIGHTS_GB:-9}"
MODEL_7_LAYERS="${MODEL_7_LAYERS:-48}"
MODEL_7_KV="${MODEL_7_KV:-4096/4096}"
MODEL_7_KV_SWA="${MODEL_7_KV_SWA:-81920/81920@1024}"

# 8 — E2B Q4_K_M: 3.11 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_8_FILE="${MODEL_8_FILE:-gemma4/gemma-4-E2B-it-Q4_K_M.gguf}"
MODEL_8_URL="${MODEL_8_URL:-https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf}"
MODEL_8_SHA256="${MODEL_8_SHA256:-740185b21d22ceb83a11c3aa62ad5842ef32c70f6096d756bbee85a1e4ec34b8}"
MODEL_8_DESC="${MODEL_8_DESC:-Gemma-4 E2B Q4_K_M (~3.11GB, fallback)}"
MODEL_8_WEIGHTS_GB="${MODEL_8_WEIGHTS_GB:-0}"
MODEL_8_LAYERS="${MODEL_8_LAYERS:-35}"
MODEL_8_KV="${MODEL_8_KV:-1536/1536}"
MODEL_8_KV_SWA="${MODEL_8_KV_SWA:-3072/3072@512}"

# --- [ SGLANG MODELS ] --------------------------------------------------------
# Used instead of the GGUF list above when the engine setting is SGLang
# (--setup). 4-bit W4A16 (compressed-tensors) builds of Google's
# quantization-aware-trained (QAT) checkpoints, pinned to a commit; sizes are
# the repos' safetensors totals. The 31B and 12B are Google's own releases;
# Google doesn't publish one for the 26B-A4B MoE, so that tier uses
# cyankiwi's QAT-based AWQ build. See
# config/ai-coder-model.conf for the MODEL_SGL_* field reference.
MODEL_SGL_COUNT="${MODEL_SGL_COUNT:-3}"
MODEL_SGL_TOOL_PARSER="${MODEL_SGL_TOOL_PARSER:-gemma4}"
MODEL_SGL_REASONING_PARSER="${MODEL_SGL_REASONING_PARSER:-gemma4}"

# 1 — Gemma-4 31B QAT W4A16: 23.3 GB; dense
MODEL_SGL_1_REPO="${MODEL_SGL_1_REPO:-google/gemma-4-31B-it-qat-w4a16-ct}"
MODEL_SGL_1_REVISION="${MODEL_SGL_1_REVISION:-52f3f65bc7a02d555763bc923bd1d9094898219d}"
MODEL_SGL_1_DESC="${MODEL_SGL_1_DESC:-Gemma-4 31B QAT W4A16 (~23.3GB)}"
MODEL_SGL_1_WEIGHTS_GB="${MODEL_SGL_1_WEIGHTS_GB:-24}"
MODEL_SGL_1_KV="${MODEL_SGL_1_KV:-20480/20480}"
MODEL_SGL_1_KV_SWA="${MODEL_SGL_1_KV_SWA:-204800/204800@1024}"
MODEL_SGL_1_MAX_CTX="${MODEL_SGL_1_MAX_CTX:-262144}"

# 2 — Gemma-4 26B-A4B QAT AWQ INT4: 17.2 GB; MoE (3.8B active)
MODEL_SGL_2_REPO="${MODEL_SGL_2_REPO:-cyankiwi/gemma-4-26B-A4B-it-qat-AWQ-INT4}"
MODEL_SGL_2_REVISION="${MODEL_SGL_2_REVISION:-18a3c7285c33ee39d3e5e16ee6fb2c18f4955ef9}"
MODEL_SGL_2_DESC="${MODEL_SGL_2_DESC:-Gemma-4 26B A4B QAT AWQ INT4 MoE (~17.2GB)}"
MODEL_SGL_2_WEIGHTS_GB="${MODEL_SGL_2_WEIGHTS_GB:-18}"
MODEL_SGL_2_KV="${MODEL_SGL_2_KV:-5120/5120}"
MODEL_SGL_2_KV_SWA="${MODEL_SGL_2_KV_SWA:-51200/51200@1024}"
MODEL_SGL_2_MAX_CTX="${MODEL_SGL_2_MAX_CTX:-262144}"

# 3 — Gemma-4 12B QAT W4A16: 10.3 GB; unconditional fallback (WEIGHTS_GB=0)
MODEL_SGL_3_REPO="${MODEL_SGL_3_REPO:-google/gemma-4-12B-it-qat-w4a16-ct}"
MODEL_SGL_3_REVISION="${MODEL_SGL_3_REVISION:-1d2c2d7f2466070e69d6fb3fd5ce9a7d75f2f6ee}"
MODEL_SGL_3_DESC="${MODEL_SGL_3_DESC:-Gemma-4 12B QAT W4A16 (~10.3GB, fallback)}"
MODEL_SGL_3_WEIGHTS_GB="${MODEL_SGL_3_WEIGHTS_GB:-0}"
MODEL_SGL_3_KV="${MODEL_SGL_3_KV:-4096/4096}"
MODEL_SGL_3_KV_SWA="${MODEL_SGL_3_KV_SWA:-81920/81920@1024}"
MODEL_SGL_3_MAX_CTX="${MODEL_SGL_3_MAX_CTX:-262144}"
MODEL_SGL_3_SIZE_GB="${MODEL_SGL_3_SIZE_GB:-11}"
# The 12B uses the newer encoder-free gemma4_unified architecture. SGLang
# v0.5.20 parses its audio_config with the conformer model's config class,
# whose output_proj_dims default (1536) ignores the checkpoint's
# audio_embed_dim (640), so weight loading fails on
# embed_audio.embedding_projection. Pin the dim back to the checkpoint's.
# The same release also never sets lm_head_is_tied for this architecture —
# see config/sglang-patches/gemma4-unified-lm-head.sh.
MODEL_SGL_3_OVERRIDE_ARGS=${MODEL_SGL_3_OVERRIDE_ARGS:-'{"audio_config":{"output_proj_dims":640}}'}
MODEL_SGL_3_PATCH="${MODEL_SGL_3_PATCH:-gemma4-unified-lm-head}"
